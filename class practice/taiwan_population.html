<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台灣各縣市人口（水平長條圖）</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { padding-top: 2rem; padding-bottom: 2rem; }
    .chart-card { height: 70vh; }
    /* Ensure the svg fills the card nicely */
    .chart-svg { width: 100%; height: 100%; display: block; }
    .table-responsive { max-height: 70vh; overflow: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">台灣各縣市人口（由多至少）</h1>

    <div class="row">
      <!-- Left column: horizontal bar chart -->
      <div class="col-md-6 mb-4">
        <div class="card chart-card">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">人口長條圖</h5>
            <svg id="populationChart" class="chart-svg" role="img" aria-label="台灣各縣市人口水平長條圖"></svg>
            <small class="text-muted mt-2">資料為示例數值，請依需求替換或接入實際 API。</small>
          </div>
        </div>
      </div>

      <!-- Right column: table with numbers -->
      <div class="col-md-6 mb-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">縣市與人口（表格）</h5>
            <div class="table-responsive">
              <table class="table table-striped table-sm" id="populationTable">
                <thead>
                  <tr>
                    <th scope="col">排名</th>
                    <th scope="col">縣市</th>
                    <th scope="col">人口</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- JS will populate rows -->
                </tbody>
              </table>
            </div>
            <p class="mt-2 small text-muted">在縮小視窗（手機）上，兩個欄位會直列呈現。</p>
          </div>
        </div>
      </div>
    </div>

    <hr>
    <p class="text-muted small">建立：Bootstrap 5 + Chart.js。若要使用真實資料，可把 `data` 陣列替換成後端 API 回傳的值。</p>
  </div>

    <script>
    // Sample population data (approximate numbers). Replace with official dataset if needed.
    const rawData = [
      { city: '新北市', pop: 4005000 },
      { city: '台中市', pop: 2820000 },
      { city: '高雄市', pop: 2740000 },
      { city: '台北市', pop: 2645000 },
      { city: '桃園市', pop: 2250000 },
      { city: '台南市', pop: 1880000 },
      { city: '彰化縣', pop: 1270000 },
      { city: '屏東縣', pop: 800000 },
      { city: '雲林縣', pop: 670000 },
      { city: '苗栗縣', pop: 540000 },
      { city: '新竹縣', pop: 574000 },
      { city: '新竹市', pop: 456000 },
      { city: '宜蘭縣', pop: 460000 },
      { city: '嘉義縣', pop: 490000 },
      { city: '南投縣', pop: 500000 },
      { city: '嘉義市', pop: 263000 },
      { city: '基隆市', pop: 370000 },
      { city: '花蓮縣', pop: 325000 },
      { city: '台東縣', pop: 200000 },
      { city: '金門縣', pop: 140000 },
      { city: '澎湖縣', pop: 100000 },
      { city: '連江縣', pop: 13000 }
    ];

    // Sort descending by population
    const data = rawData.slice().sort((a,b) => b.pop - a.pop);

    // D3 horizontal bar chart (responsive + animated)
    function renderChart() {
      const container = document.getElementById('populationChart');
      // clear previous
      container.innerHTML = '';

      const margin = {top: 20, right: 120, bottom: 36, left: 140};
      // compute width/height using bounding box of svg container to ensure chart fits the card
      const bbox = container.getBoundingClientRect();
      const totalWidth = Math.max(360, Math.floor(bbox.width) || container.clientWidth || 800);
      const totalHeightBBox = Math.max(220, Math.floor(bbox.height) || container.clientHeight || 360);

      const width = Math.max(200, totalWidth - margin.left - margin.right);
      // limit chart height to container height so bars stay inside the visible card
      const height = Math.max(120, totalHeightBBox - margin.top - margin.bottom);

      const viewW = width + margin.left + margin.right;
      const viewH = height + margin.top + margin.bottom;
      const svgSel = d3.select(container)
        .attr('viewBox', `0 0 ${viewW} ${viewH}`)
        .attr('preserveAspectRatio', 'xMidYMid meet')
        .style('overflow', 'hidden');

      const svg = svgSel.append('g')
        .attr('transform', `translate(${margin.left},${margin.top})`);

      const x = d3.scaleLinear()
        .domain([0, d3.max(data, d => d.pop)])
        .nice()
        .range([0, width]);

      // compute band size so total bars fit within available height
      const y = d3.scaleBand()
        .domain(data.map(d => d.city))
        .range([0, height])
        .paddingInner(0.08)
        .paddingOuter(0.06);

      // x axis
      const xAxis = d3.axisBottom(x).ticks(5).tickFormat(d3.format(','));
      svg.append('g')
        .attr('transform', `translate(0, ${height})`)
        .attr('class', 'x-axis')
        .call(xAxis)
        .selectAll('text')
        .style('font-size', '12px');

      // y axis (city names)
      const yAxis = d3.axisLeft(y).tickSize(0);
      svg.append('g')
        .attr('class', 'y-axis')
        .call(yAxis)
        .selectAll('text')
        .style('font-size', '13px');

      // bars (start at width 0 for animation)
      const bars = svg.selectAll('.bar')
        .data(data, d => d.city)
        .join('rect')
        .attr('class', 'bar')
        .attr('x', 0)
        .attr('y', d => y(d.city))
        .attr('height', y.bandwidth())
        .attr('width', 0)
        .attr('fill', (d,i) => i < 5 ? '#1f78b4' : '#4fb0a2');

      // animate bars to their final width
      bars.transition()
        .duration(900)
        .ease(d3.easeCubicOut)
        .attr('width', d => x(d.pop));

      // population labels (place inside bar when space, else to the right)
      const labels = svg.selectAll('.label')
        .data(data, d => d.city)
        .join('text')
        .attr('class', 'label')
        .attr('y', d => y(d.city) + y.bandwidth() / 2)
        .attr('dy', '0.35em')
        .style('font-size', '12px')
        .style('fill', '#fff')
        .style('pointer-events', 'none')
        .text(d => d.pop.toLocaleString())
        .attr('x', 6)
        .style('opacity', 0);

      // place labels after bars animate; clamp positions so they remain within viewBox
      labels.transition()
        .delay(200)
        .duration(700)
        .style('opacity', 1)
        .attrTween('x', function(d) {
          const labelText = d.pop.toLocaleString();
          // approximate label width (characters * px), conservative
          const approxLabelWidth = Math.min(120, labelText.length * 7 + 8);
          const barW = Math.min(x(d.pop), width);
          const insideX = barW - approxLabelWidth - 6; // place inside near right edge
          const outsideX = Math.min(barW + 10, width - 8); // outside but clamped to chart area
          const start = 6;
          return function(t) {
            const useInside = insideX > 10;
            const target = useInside ? insideX : outsideX;
            return `${start + (target - start) * t}`;
          };
        })
        .style('fill', function(d) { return (x(d.pop) > 100) ? '#fff' : '#222'; });

      // subtle fade-in for axes
      svg.selectAll('.x-axis, .y-axis')
        .style('opacity', 0)
        .transition()
        .duration(600)
        .style('opacity', 1);
    }

    // initial render
    renderChart();

    // redraw on resize (debounced)
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderChart(), 160);
    });

    // Populate table on the right
    const tbody = document.querySelector('#populationTable tbody');
    data.forEach((d, idx) => {
      const tr = document.createElement('tr');
      const rankTd = document.createElement('td'); rankTd.textContent = idx + 1;
      const cityTd = document.createElement('td'); cityTd.textContent = d.city;
      const popTd = document.createElement('td'); popTd.textContent = d.pop.toLocaleString();
      tr.appendChild(rankTd);
      tr.appendChild(cityTd);
      tr.appendChild(popTd);
      tbody.appendChild(tr);
    });
    </script>

  <!-- Bootstrap JS (optional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
